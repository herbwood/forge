[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-posttraining"
version = "0.1.0"
description = "FORGE ontology-verified post-training with ORSD, VTC-SD, and GCTH"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.8,<3", "numpy>=1.26,<3", "PyYAML>=6,<7", "Pillow>=10,<13"]

[project.optional-dependencies]
vlm = ["transformers==4.57.6", "peft==0.21.2"]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[tool.setuptools]
packages = ["forge_posttraining", "forge_posttraining.adapters", "integrations", "integrations.easyr1"]

[tool.setuptools.package-dir]
forge_posttraining = "src/forge_posttraining"
integrations = "integrations"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E9"]
